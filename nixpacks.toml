# Railway / Nixpacks build for tg-api.
# `--include=dev` forces devDependencies (typescript) to install even though
# NODE_ENV=production is set on the service — otherwise `npm run build` (tsc)
# fails with "tsc: not found". The compiled output in dist/ has no dev-dep
# runtime needs, so the production image stays lean.

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
